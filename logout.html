<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />   
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Internet hotspot - Log out</title>
<style>
    /* Neumorphic Dark Theme Styling */
    *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    :root {
        --dark-bg: #1e2028;
        --darker-shadow: rgba(0, 0, 0, 0.5);
        --lighter-shadow: rgba(66, 66, 90, 0.15);
        --text-color: #e0e0e0;
        --highlight-color: #6366f1;
        --success-color: #10b981;
        --link-color: #a5b4fc;
        --border-color: rgba(255, 255, 255, 0.05);
    }
    
    html, body {
        height: 100%;
        width: 100%;
    }
    
    body {
        background-color: var(--dark-bg);
        color: var(--text-color);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
    }
    
    .ie-fixMinHeight {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
    }
    
    .main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
        padding: 2rem;
    }
    
    .wrap {
        background-color: var(--dark-bg);
        border-radius: 15px;
        padding: 2.5rem;
        box-shadow: 8px 8px 16px var(--darker-shadow), 
                    -8px -8px 16px var(--lighter-shadow);
        max-width: 90%;
        width: 450px;
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border-color);
    }
    
    h1 {
        color: var(--success-color);
        margin-bottom: 1.5rem;
        font-size: 1.8rem;
        text-align: center;
        position: relative;
    }
    
    h1::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: 3px;
        background: linear-gradient(90deg, var(--success-color), transparent);
        border-radius: 3px;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
    }
    
    td {
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-color);
    }
    
    .header-td {
        font-weight: 600;
        color: var(--highlight-color);
    }
    
    .logbtn {
        width: 100%;
        padding: 0.75rem;
        background-color: var(--dark-bg);
        color: var(--highlight-color);
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 5px 5px 10px var(--darker-shadow), 
                    -5px -5px 10px var(--lighter-shadow);
        margin-top: 1rem;
    }
    
    .logbtn:hover {
        box-shadow: 4px 4px 8px var(--darker-shadow), 
                    -4px -4px 8px var(--lighter-shadow),
                    inset 1px 1px 2px var(--darker-shadow),
                    inset -1px -1px 2px var(--lighter-shadow);
        transform: translateY(2px);
    }
    
    .logbtn:active {
        box-shadow: inset 4px 4px 8px var(--darker-shadow),
                    inset -4px -4px 8px var(--lighter-shadow);
    }
    
    /* Background Cubes Animation */
    .cube {
        position: absolute;
        background-color: rgba(255, 255, 255, 0.02);
        border-radius: 8px;
        animation: cube-animation 25s infinite linear;
        z-index: 0;
    }
    
    .cube:nth-child(1) {
        width: 80px;
        height: 80px;
        top: 10%;
        left: 10%;
        animation-delay: 0s;
    }
    
    .cube:nth-child(2) {
        width: 60px;
        height: 60px;
        top: 70%;
        left: 80%;
        animation-delay: -5s;
    }
    
    .cube:nth-child(3) {
        width: 100px;
        height: 100px;
        top: 40%;
        left: 30%;
        animation-delay: -10s;
    }
    
    .cube:nth-child(4) {
        width: 50px;
        height: 50px;
        top: 80%;
        left: 20%;
        animation-delay: -15s;
    }
    
    .cube:nth-child(5) {
        width: 70px;
        height: 70px;
        top: 20%;
        left: 80%;
        animation-delay: -20s;
    }
    
    .cube:nth-child(6) {
        width: 110px;
        height: 110px;
        top: 60%;
        left: 60%;
        animation-delay: -25s;
    }
    
    @keyframes cube-animation {
        0% {
            transform: rotate(0deg) translate(0, 0) rotate(0deg) scale(1);
            opacity: 0.5;
        }
        25% {
            opacity: 0.3;
        }
        50% {
            transform: rotate(180deg) translate(100px, 100px) rotate(-180deg) scale(1.2);
            opacity: 0.5;
        }
        75% {
            opacity: 0.3;
        }
        100% {
            transform: rotate(360deg) translate(0, 0) rotate(-360deg) scale(1);
            opacity: 0.5;
        }
    }
    
    /* Logout Indicator */
    .logout-indicator {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        background: var(--dark-bg);
        box-shadow: inset 4px 4px 8px var(--darker-shadow),
                    inset -4px -4px 8px var(--lighter-shadow),
                    4px 4px 8px var(--darker-shadow),
                    -4px -4px 8px var(--lighter-shadow);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .logout-indicator svg {
        width: 40px;
        height: 40px;
        color: var(--success-color);
        animation: fadeIn 1s ease-in-out;
    }
    
    @keyframes fadeIn {
        0% {
            opacity: 0;
            transform: scale(0.8);
        }
        100% {
            opacity: 1;
            transform: scale(1);
        }
    }
</style>
<script>
    function openLogin() {
	if (window.name != 'hotspot_logout') return true;
	open('$(link-login)', '_blank', '');
	window.close();
	return false;
    }
</script>
</head>

<body class="dark">
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="cube"></div>
            <div class="cube"></div>
            <div class="cube"></div>
            <div class="cube"></div>
            <div class="cube"></div>
            <div class="cube"></div>
            <div class="wrap">
                <div class="logout-indicator">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </div>
                <h1>You have just logged out!</h1> 
                <table>  
                    <tr><td class="header-td">Username</td><td>$(username)</td></tr>
                    <tr><td class="header-td">IP address</td><td>$(ip)</td></tr>
                    <tr><td class="header-td">MAC address</td><td>$(mac)</td></tr>
                    <tr><td class="header-td">Session time</td><td>$(uptime)</td></tr>
                    $(if session-time-left)
                    <tr><td class="header-td">Time left</td><td>$(session-time-left)</td></tr>
                    $(endif)
                    <tr><td class="header-td">Bytes up / down:</td><td>$(bytes-in-nice) / $(bytes-out-nice)</td></tr>
                </table>


                <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                <input type="submit" value="Log in" class="logbtn">
                </form>
            </div>
        </div>
    </div>

</body>
</html>
