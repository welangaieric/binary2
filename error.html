<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet hotspot - Error</title>
    <style>
        /* Neumorphic Dark Theme Styling */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        :root {
            --dark-bg: #1e2028;
            --darker-shadow: rgba(0, 0, 0, 0.5);
            --lighter-shadow: rgba(66, 66, 90, 0.15);
            --text-color: #e0e0e0;
            --highlight-color: #6366f1;
            --error-color: #ef4444;
            --link-color: #a5b4fc;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }
        
        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .ie-fixMinHeight {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }
        
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        
        .wrap {
            background-color: var(--dark-bg);
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: 8px 8px 16px var(--darker-shadow), 
                        -8px -8px 16px var(--lighter-shadow);
            max-width: 90%;
            width: 400px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        h1 {
            color: var(--error-color);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
            position: relative;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, var(--error-color), transparent);
            border-radius: 3px;
        }
        
        .info {
            text-align: center;
            color: var(--text-color);
            margin-top: 1.5rem;
            font-size: 1rem;
        }
        
        a {
            color: var(--link-color);
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
        }
        
        a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--link-color);
            transition: width 0.3s ease;
        }
        
        a:hover {
            color: #ffffff;
        }
        
        a:hover::after {
            width: 100%;
        }
        
        /* Background Cubes Animation */
        .cube {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            animation: cube-animation 25s infinite linear;
            z-index: 0;
        }
        
        .cube:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .cube:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 70%;
            left: 80%;
            animation-delay: -5s;
        }
        
        .cube:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 40%;
            left: 30%;
            animation-delay: -10s;
        }
        
        .cube:nth-child(4) {
            width: 50px;
            height: 50px;
            top: 80%;
            left: 20%;
            animation-delay: -15s;
        }
        
        @keyframes cube-animation {
            0% {
                transform: rotate(0deg) translate(0, 0) rotate(0deg) scale(1);
                opacity: 0.5;
            }
            25% {
                opacity: 0.3;
            }
            50% {
                transform: rotate(180deg) translate(100px, 100px) rotate(-180deg) scale(1.2);
                opacity: 0.5;
            }
            75% {
                opacity: 0.3;
            }
            100% {
                transform: rotate(360deg) translate(0, 0) rotate(-360deg) scale(1);
                opacity: 0.5;
            }
        }
        
        /* Error Indicator */
        .error-indicator {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: var(--dark-bg);
            box-shadow: inset 4px 4px 8px var(--darker-shadow),
                        inset -4px -4px 8px var(--lighter-shadow),
                        4px 4px 8px var(--darker-shadow),
                        -4px -4px 8px var(--lighter-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-indicator svg {
            width: 40px;
            height: 40px;
            color: var(--error-color);
            animation: shake 1s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
    </style>
</head>

<body class="dark">
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="cube"></div>
            <div class="cube"></div>
            <div class="cube"></div>
            <div class="cube"></div>
            <div class="wrap">
                <div class="error-indicator">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                </div>
                <h1>Hotspot error: $(error)</h1>
                <p class="info">Log in page: <a href="$(link-login)">$(link-login)</a></p>
            </div>
        </div>
    </div>
</body>

</html>
