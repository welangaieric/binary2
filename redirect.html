$(if http-status == 302)Hotspot redirect$(endif)
$(if http-header == "Location")$(link-redirect)$(endif)
<html>
<head>
<title>...</title>
<meta http-equiv="refresh" content="0; url=$(link-redirect)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<style>
    /* Neumorphic Dark Theme Styling */
    *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    :root {
        --dark-bg: #1e2028;
        --darker-shadow: rgba(0, 0, 0, 0.5);
        --lighter-shadow: rgba(66, 66, 90, 0.15);
        --text-color: #e0e0e0;
        --highlight-color: #6366f1;
    }
    
    body {
        background-color: var(--dark-bg);
        color: var(--text-color);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }
    
    .loader {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--dark-bg);
        box-shadow: inset 4px 4px 8px var(--darker-shadow),
                    inset -4px -4px 8px var(--lighter-shadow),
                    4px 4px 8px var(--darker-shadow),
                    -4px -4px 8px var(--lighter-shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    
    .loader::before {
        content: '';
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--highlight-color);
        animation: spin 1s linear infinite;
    }
    
    .loader::after {
        content: '';
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--highlight-color);
        opacity: 0.6;
        animation: spin 1.5s linear infinite reverse;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
</head>
<body>
    <div class="loader"></div>
</body>
</html>
